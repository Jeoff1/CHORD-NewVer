{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · CHORD</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-5.3.3/bootstrap.min.css' %}">
  <script src="{% static 'vendor/bootstrap-5.3.3/bootstrap.bundle.min.js' %}" defer></script>
  <script src="{% static 'vendor/htmx-2.0.4/htmx.min.js' %}" defer></script>
</head>
<body class="bg-body-tertiary" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <nav class="navbar navbar-expand-lg bg-body border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'core:home' %}">CHORD</a>
      {% if user.is_authenticated %}
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#main-nav" aria-controls="main-nav"
                aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-nav">
          <ul class="navbar-nav me-auto">{% block nav %}{% endblock %}</ul>
          <div class="d-flex align-items-center gap-3">
            <span class="navbar-text">{{ user.get_full_name|default:user.get_username }}</span>
            <form method="post" action="{% url 'accounts:logout' %}">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline-secondary btn-sm">Sign out</button>
            </form>
          </div>
        </div>
      {% endif %}
    </div>
  </nav>

  <main class="container py-4">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
