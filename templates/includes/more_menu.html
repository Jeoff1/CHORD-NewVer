{# The "More" dropdown for a page's other actions (design system, Phase 9A A7). Rendered by {% more_menu %} only when at least one item is left after the permission checks. #}
<div class="dropdown">
  <button type="button" class="btn btn-outline-secondary dropdown-toggle chord-btn" data-bs-toggle="dropdown" aria-expanded="false">{{ label }}</button>
  <ul class="dropdown-menu dropdown-menu-end">{{ items }}</ul>
</div>
