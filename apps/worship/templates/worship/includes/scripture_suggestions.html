{# Suggested passages for the Main scripture field (Phase 9C), swapped into its list by HTMX. #}
{% for value, description in suggestions %}
  <li class="list-group-item list-group-item-action chord-scripture__option" role="option" id="scripture-option-{{ forloop.counter }}" aria-selected="false" data-value="{{ value }}">
    <span class="fw-semibold">{{ value }}</span> <span class="small text-body-secondary">{{ description }}</span>
  </li>
{% endfor %}
