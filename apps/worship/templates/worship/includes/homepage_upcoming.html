{# Upcoming services (Phase 9B): date, time and kind only. #}
<section class="card shadow-sm mb-4" aria-labelledby="upcoming-title">
  <div class="card-body">
    <h2 class="h5" id="upcoming-title">Upcoming services</h2>
    <ul class="list-unstyled mb-0">
      {% for service in section.upcoming %}
        <li class="mb-1"><span class="fw-semibold">{{ service.starts_at|date:"D, M j" }}</span> · {{ service.starts_at|time:"g:i A" }} · {{ service.kind }}</li>
      {% endfor %}
    </ul>
  </div>
</section>
