{% extends "form_page.html" %}

{% block content %}
  {% if validlink %}
    {{ block.super }}
  {% else %}
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-7 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4">This link doesn't work</h1>
            <p>It may have been used already or have expired. Ask for a new one.</p>
            <a href="{% url 'accounts:password_reset' %}" class="btn btn-primary">Reset password again</a>
          </div>
        </div>
      </div>
    </div>
  {% endif %}
{% endblock %}
