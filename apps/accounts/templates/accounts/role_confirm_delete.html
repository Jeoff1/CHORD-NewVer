{% extends "base.html" %}

{% block title %}Delete role{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm border-danger">
        <div class="card-body p-4">
          <h2 class="h4">Delete the role {{ object.name }}?</h2>
          <p>
            Users who hold this role lose its permissions. The users themselves
            are not changed otherwise. This can't be undone.
          </p>
          <form method="post" class="d-flex gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete role</button>
            <a href="{% url 'accounts:role_list' %}" class="btn btn-outline-secondary">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
