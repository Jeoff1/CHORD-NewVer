{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-3">Sign in</h1>
          <form method="post">
            {% csrf_token %}
            {{ form }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
          </form>
          <p class="mt-3 mb-0 text-center small">
            <a href="{% url 'accounts:password_reset' %}">Forgot your password?</a>
          </p>
          <p class="mt-2 mb-0 text-center small">
            No account yet? <a href="{% url 'accounts:signup' %}">Create one</a> or <a href="{% url 'churches:register' %}">sign in your church</a>.
          </p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
