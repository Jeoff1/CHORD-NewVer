{# The Active switch of a church-edited list: ticking it saves at once. #}
<form method="post" action="{{ switch_url }}" hx-post="{{ switch_url }}" hx-trigger="change" hx-swap="outerHTML" class="form-check form-switch mb-0 d-inline-flex align-items-center gap-2">
  {% csrf_token %}
  <input class="form-check-input" type="checkbox" role="switch" name="is_active" id="active-{{ item.pk }}"{% if value %} checked{% endif %}>
  <label class="form-check-label small text-body-secondary" for="active-{{ item.pk }}"><span class="visually-hidden">{{ item }}: </span>{% if value %}On{% else %}Off{% endif %}</label>
  <noscript><button type="submit" class="btn btn-sm btn-outline-secondary">Save</button></noscript>
</form>
